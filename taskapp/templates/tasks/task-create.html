{% extends "_base.html" %}

{% block content %}
<h2 class="fw-bold">Creacion de tarea</h2>
<div class="row bg-white px-3 py-3 mx-2 my-5 rounded pb-5 shadow-lg">
    <div class="col"></div>
    <div class="col-12">
        <form method="POST" action="/tasks/new/">
            {% csrf_token %}
            {{ form.as_p }}
            <fieldset>
                <legend>Прикрепить файлы</legend>
                {{ file_formset.management_form }}
                {% for file_form in file_formset %}
                    <div class="file-row">
                        {{ file_form.file }}
                        {{ file_form.errors }}
                    </div>
                {% endfor %}
            </fieldset>
            <button type="submit" class="btn btn-primary">Crear</button>
        </form>
    </div>
    <div class="col"></div>
</div>
{% endblock %}
